server.port=8081
spring.main.allow-bean-definition-overriding=true

# =========================================================
# Disable Auto-configuration (we provide custom config)
# =========================================================
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# =========================================================
# Database - Primary (writes)
# =========================================================
#spring.datasource.primary.url=jdbc:postgresql://db-primary:54832/cap_db
spring.datasource.primary.url=jdbc:postgresql://localhost:54332/cap_db
spring.datasource.primary.username=root
spring.datasource.primary.password=root
spring.datasource.primary.driver-class-name=org.postgresql.Driver

# =========================================================
# Database - Replica (reads)
# =========================================================
#spring.datasource.replica.url=jdbc:postgresql://db-replica:5433/cap_db
spring.datasource.replica.url=jdbc:postgresql://localhost:5433/cap_db
spring.datasource.replica.username=root
spring.datasource.replica.password=root
spring.datasource.replica.driver-class-name=org.postgresql.Driver

# =========================================================
# JPA / Hibernate (configured in DataSourceConfig)
# =========================================================
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL13Dialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cap-availability

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cap-availability

  template:
    metadata:
      labels:
        app: cap-availability
    spec:
      containers:
        - name: cap-availability
          image: cap-availability-app:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 718Mi

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cap-availability

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cap-availability
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
#    - type: Resource
#      resource:
#        name: memory
#        target:
#          type: Utilization
#          averageUtilization: 70

---

apiVersion: v1
kind: Service
metadata:
  name: cap-availability
  labels:
    name: cap-availability

spec:
  type: LoadBalancer

  selector:
    app: cap-availability
  ports:
    - port: 8080
      targetPort: 8080


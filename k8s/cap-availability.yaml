---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 2

  selector:
    matchLabels:
      app: db

  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: postgres:13

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_PASSWORD
              value: root
            - name: POSTGRES_USER
              value: root
            - name: POSTGRES_DB
              value: capavailability_db

---

apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  type: ClusterIP
  selector:
    app: db

  ports:
    - port: 5432
      targetPort: 5432

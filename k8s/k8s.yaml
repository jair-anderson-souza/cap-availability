apiVersion: apps/v1
kind: Deployment
metadata:
  name: cap-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cap-api
  template:
    metadata:
      labels:
        app: cap-api
    spec:
      initContainers:
        - name: wait-for-primary
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL primary..."
              
              until nc -z db-primary 5432; do
                echo "Primary not ready..."
                sleep 2
              done
              
              echo "PostgreSQL primary is ready."

      containers:
        - name: cap-api
          image: cap-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_PRIMARY_HOST
              value: db-primary
            - name: DB_PRIMARY_PORT
              value: "5432"
            - name: DB_REPLICA_HOST
              value: db-replica
            - name: DB_REPLICA_PORT
              value: "5432"
            - name: DB_USERNAME
              value: root
            - name: DB_PASSWORD
              value: root
            - name: DB_NAME
              value: cap_db
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 718Mi

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cap-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cap-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
apiVersion: v1
kind: Service
metadata:
  name: cap-api
spec:
  type: LoadBalancer
  selector:
    app: cap-api
  ports:
    - port: 8080
      targetPort: 8080

---

apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---

apiVersion: v1
kind: Service
metadata:
  name: db-primary
spec:
  type: ClusterIP
  selector:
    app: postgres
    statefulset.kubernetes.io/pod-name: postgres-0
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---

apiVersion: v1
kind: Service
metadata:
  name: db-replica
spec:
  type: ClusterIP
  selector:
    app: postgres
    statefulset.kubernetes.io/pod-name: postgres-1
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: db-primary-init
data:
  01-replication.sql: |
    CREATE ROLE replicator
      WITH REPLICATION
      LOGIN
      PASSWORD 'replicator_password';

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: db-primary-config
data:
  02-replication.sh: |
    #!/bin/bash
    set -e
    
    echo "Configuring PostgreSQL authentication..."
    
    cat >> "${PGDATA}/pg_hba.conf" <<'EOF'
    
    # Kubernetes application connections
    host all all 0.0.0.0/0 md5
    host all all ::/0 md5
    
    # Kubernetes streaming replication
    host replication replicator 0.0.0.0/0 md5
    host replication replicator ::/0 md5
    EOF
    
    echo "PostgreSQL authentication configured."

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 2
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      initContainers:
        - name: init-replica
          image: postgres:13

          command:
            - bash
            - -c
            - |
              set -e
              
              echo "Pod: ${HOSTNAME}"
              
              # =================================================
              # PRIMARY
              # =================================================
              
              if [ "${HOSTNAME}" = "postgres-0" ]; then
                echo "PRIMARY: skipping replica initialization."
                exit 0
              fi
              
              # =================================================
              # REPLICA
              # =================================================
              
              echo "REPLICA: waiting for primary..."
              
              until pg_isready \
                -h postgres-0.postgres \
                -p 5432 \
                -U root \
                -d cap_db; do
              
                echo "Primary not ready..."
                sleep 3
              
              done
              
              echo "Primary is ready."
              
              # Se o diretório já estiver inicializado,
              # não executa pg_basebackup novamente.
              
              if [ -f "${PGDATA}/PG_VERSION" ]; then
                echo "Replica data directory already initialized."
                exit 0
              fi
              
              echo "Creating replica with pg_basebackup..."
              
              export PGPASSWORD="replicator_password"
              
              pg_basebackup \
                -h postgres-0.postgres \
                -p 5432 \
                -U replicator \
                -D "${PGDATA}" \
                -Fp \
                -Xs \
                -P \
                -R
              
              chmod 700 "${PGDATA}"
              
              echo "Replica initialized successfully."

          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data

      # ===================================================
      # POSTGRESQL CONTAINER
      # ===================================================

      containers:
        - name: postgres
          image: postgres:13

          ports:
            - name: postgres
              containerPort: 5432

          env:
            - name: POSTGRES_USER
              value: root

            - name: POSTGRES_PASSWORD
              value: root

            - name: POSTGRES_DB
              value: cap_db

            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          args:
            - postgres
            - -c
            - wal_level=replica
            - -c
            - max_wal_senders=10
            - -c
            - max_replication_slots=10
            - -c
            - hot_standby=on

          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data

            - name: primary-init
              mountPath: /docker-entrypoint-initdb.d/01-replication.sql
              subPath: 01-replication.sql
              readOnly: true

            - name: primary-config
              mountPath: /docker-entrypoint-initdb.d/02-replication.sh
              subPath: 02-replication.sh
              readOnly: true

          # =================================================
          # READINESS
          # =================================================

          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - root
                - -d
                - cap_db

            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          # =================================================
          # LIVENESS
          # =================================================

          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - root
                - -d
                - cap_db
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: primary-init
          configMap:
            name: db-primary-init
            defaultMode: 0644
        - name: primary-config
          configMap:
            name: db-primary-config
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: db-storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi